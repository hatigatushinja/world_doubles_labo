body{font-family:&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,system-ui,sans-serif;color:var(--txt);background:#f5f7fb}

.card h2{font-size:17px;margin-bottom:4px}.card .sub{font-size:12px;color:var(--mut);margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:#eef2f8;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font:inherit;font-size:12px;color:#556;cursor:pointer}

.tip b{color:var(--ball)}
.draw{stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 2.2s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
.g2{display:grid;grid-template-columns:3fr 2fr;gap:22px}
.heat{display:grid;grid-template-columns:repeat(26,1fr);gap:4px}
.heat div{aspect-ratio:1;border-radius:4px;background:#eef1f5;position:relative;cursor:default}
.heat .lv1{background:#cfe0f5}.heat .lv2{background:#8fb5e6}.heat .lv3{background:#3a78c9}.heat .lv4{background:#1f4e8c}.heat .lv5{background:var(--ball);outline:2px solid var(--court)}

.sim{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
.sim label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.sim select,.sim input[type=range]{width:100%}.sim select{padding:8px;border-radius:8px;border:1px solid var(--line);font:inherit}
.gauge{text-align:center}.gauge .big{font-size:76px;font-weight:900;color:var(--court);line-height:1;font-variant-numeric:tabular-nums}
.gauge .big small{font-size:20px}.gauge .msg{margin-top:8px;font-weight:700}
.ok{color:var(--win)}.ng{color:var(--loss)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;color:var(--mut);font-weight:500}
.w{color:#fff;background:var(--win);border-radius:4px;padding:1px 6px;font-size:11px}.lz{color:#fff;background:var(--loss);border-radius:4px;padding:1px 6px;font-size:11px}

.pill.G{background:#1f4e8c;color:#fff}.pill.M{background:#3a78c9;color:#fff}.pill.A{background:#8fb5e6}

.scroll{max-height:420px;overflow:auto}
.lvbars div{display:grid;grid-template-columns:90px 1fr 60px;gap:8px;align-items:center;font-size:12px;margin:8px 0}
.lvbars .t{height:14px;border-radius:7px;background:#fde3e3;overflow:hidden}.lvbars .t span{display:block;height:100%;background:var(--win);width:0;transition:width 1.2s}
.note{font-size:11px;color:var(--mut);margin-top:10px;line-height:1.7}
.noanim *{animation:none!important;transition:none!important;stroke-dashoffset:0!important}
