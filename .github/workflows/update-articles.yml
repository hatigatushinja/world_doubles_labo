name: update-articles
on:
  schedule:
    - cron: "0 22,4,10 * * *"   # JST 7:00 / 13:00 / 19:00
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: update-articles, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run collect
      - run: npm run generate
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL }}
          GLM_MODEL: ${{ vars.GLM_MODEL }}
          MAX_ARTICLES: "3"
      - run: npm run build   # 壊れた記事はここで落としてpushしない
      - name: commit
        run: |
          git config user.name "doubles-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/articles data/seen.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "articles: $(date -u +%F)"
          git push
